<!DOCTYPE html>
<html>
<head>
  <title>🤖 AI Assistant GPT-style Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    <div class="history">
      <p>📜 Recent Chats</p>
      <div class="hist-item">💬 What is AI?</div>
      <div class="hist-item">💬 Who is Mythrri?</div>
      <div class="hist-item">💬 Python vs JavaScript</div>
    </div>
    <div class="profile">
      <div class="avatar">M</div>
      <div><b>Mythrri</b><br><small>Free Plan</small></div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <b>🤖 AI Assistant</b> <span></span>
      <button onclick="toggleDark()">🌙 Dark</button>
    </div>

    <div id="chatBox" class="chat-box">
      <div class="welcome">
        <div class="logo">🤖</div>
       <h1>How can I help you today?</h1>
<p>Ask me anything!</p>
        <div class="suggestions">
         <button onclick="askSuggestion('What is AI?')">What is AI?</button>
<button onclick="askSuggestion('Tell me a joke')">Tell me a joke</button>
<button onclick="askSuggestion('Write a poem')">Write a poem</button>
<button onclick="askSuggestion('Explain Python')">Explain Python</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Message AI Assistant..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">➤</button>
    </div>
   AI Assistant can make mistakes. Built by Mythrri with HTML, CSS & JS.
  </div>
  <script src="app.js"></script>
</body>
</html>
